[workspace]
resolver = "3"
members = ["crates/sim", "crates/render", "crates/game", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sim = { path = "crates/sim" }
render = { path = "crates/render" }
uniffi = "0.32.1"

# Baseline: Tris Oaten's "Rust: Don't Panic" set (issue #8). Denies live here, so CI
# runs plain `cargo clippy` (no -D warnings) and nursery warnings never block.
[workspace.lints.rust]
# sim upgrades this to forbid; render/game allow it narrowly (CAMetalLayer pointer, UniFFI).
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
opt-level = 3
debug = 1
