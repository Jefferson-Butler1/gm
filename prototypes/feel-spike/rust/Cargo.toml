[workspace]
members = [".", "uniffi-bindgen"]
resolver = "2"

[package]
name = "spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl"] }
uniffi = "0.32.1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
debug = 1
